<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}VisionGuard{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ url_for('upload_page') }}"><span class="brand-mark">VG</span>VisionGuard</a>
    <nav aria-label="Main navigation">
      <a href="{{ url_for('upload_page') }}" {% if request.endpoint == 'upload_page' %}aria-current="page"{% endif %}>Check an image</a>
      <a href="{{ url_for('history') }}" {% if request.endpoint == 'history' %}aria-current="page"{% endif %}>History</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer class="site-footer"><span>VisionGuard · 23l-0829_A2_Ops</span><span>An experimental image-origin detector.</span></footer>
  <script src="{{ url_for('static', filename='upload.js') }}" defer></script>
</body>
</html>
