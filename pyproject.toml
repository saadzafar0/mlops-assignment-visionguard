[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "visionguard"
version = "0.1.0"
description = "23l-0829_A2_Ops: AI-generated versus real image classification"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0,<2.3",
  "pandas>=2.2,<3",
  "Pillow>=11,<13",
  "matplotlib>=3.9,<4",
  "scikit-learn>=1.6,<2",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6,<7",
  "tensorflow-cpu>=2.20,<2.21",
  "mlflow>=3.5,<4",
  "dagshub>=0.6,<1",
  "dvc[s3]>=3.60,<4",
  "keras-tuner>=1.4,<2",
  "flask>=3.1,<4",
  "gunicorn>=23,<27",
  "sqlalchemy>=2.0,<2.2",
  "psycopg[binary]>=3.2,<4",
  "requests>=2.32,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
