name: 23l-0829_a2_ops
services:
  web:
    build:
      context: .
      target: web
    ports:
      - "127.0.0.1:${WEB_PORT:-5000}:8000"
    environment:
      PROJECT_NAME: 23l-0829_A2_Ops
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-visionguard}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-visionguard}
      INFERENCE_BACKEND: ${INFERENCE_BACKEND:-local}
      INFERENCE_API_URL: ${INFERENCE_API_URL:-}
      INFERENCE_API_KEY: ${INFERENCE_API_KEY:-}
      INFERENCE_TIMEOUT_SECONDS: ${INFERENCE_TIMEOUT_SECONDS:-120}
      DISPLAY_TIMEZONE: Asia/Karachi
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-visionguard}
      POSTGRES_DB: ${POSTGRES_DB:-visionguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
volumes:
  postgres_data:
